name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# As actions são fixadas por commit SHA (e não por tag) para evitar que uma tag
# alterada no repositório da action execute código inesperado na pipeline.

jobs:
  backend:
    name: Backend (dependências, compilação e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/ciclo-circadiano
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Instalar dependências
        run: ./mvnw -B -ntp dependency:resolve

      # Equivalente Java da "validação de sintaxe": o código (e os testes) precisam compilar.
      - name: Validar sintaxe (compilar código e testes)
        run: ./mvnw -B -ntp test-compile

      - name: Executar testes automatizados
        run: ./mvnw -B -ntp test

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-de-teste
          path: backend/ciclo-circadiano/target/surefire-reports/
          if-no-files-found: ignore

  seguranca:
    name: Verificação básica de segurança
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Garantir que arquivos .env não estão versionados
        run: |
          arquivos="$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '\.env\.example$' || true)"
          if [ -n "$arquivos" ]; then
            echo "::error::Arquivos .env versionados (remova do Git e troque as credenciais):"
            echo "$arquivos"
            exit 1
          fi
          echo "Nenhum arquivo .env versionado."

      - name: Procurar chaves privadas e tokens no repositório
        run: |
          padrao='-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          codigo=0
          git grep -nIE -e "$padrao" -- . ':!.github/workflows/ci.yml' || codigo=$?
          if [ "$codigo" -eq 0 ]; then
            echo "::error::Possível segredo versionado (veja as linhas acima)."
            exit 1
          elif [ "$codigo" -ne 1 ]; then
            echo "::error::Falha ao executar a busca de segredos (código $codigo)."
            exit "$codigo"
          fi
          echo "Nenhum padrão de segredo encontrado."

  docker:
    name: Docker (build e smoke test)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 25
    env:
      COMPOSE_ENV_FILE: backend/ciclo-circadiano/.env
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Criar .env temporário com credenciais descartáveis
        run: |
          DB_PASSWORD="$(openssl rand -hex 16)"
          MYSQL_ROOT_PASSWORD="$(openssl rand -hex 16)"
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$MYSQL_ROOT_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "DB_USER=ciclo_user"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } > "$COMPOSE_ENV_FILE"

      - name: Validar docker-compose.yml
        run: docker compose --env-file "$COMPOSE_ENV_FILE" config --quiet

      - name: Build das imagens Docker
        run: docker compose --env-file "$COMPOSE_ENV_FILE" build

      - name: Subir a aplicação (backend, frontend e MySQL)
        run: docker compose --env-file "$COMPOSE_ENV_FILE" up -d --wait --wait-timeout 180

      - name: Segurança - backend não executa como root
        run: |
          usuario="$(docker inspect --format '{{.Config.User}}' ciclo-circadiano-backend)"
          echo "Usuário do container do backend: '${usuario}'"
          if [ -z "$usuario" ] || [ "$usuario" = "0" ] || [ "$usuario" = "root" ]; then
            echo "::error::O container do backend está executando como root."
            exit 1
          fi

      - name: Smoke test da aplicação
        run: bash scripts/smoke-test.sh

      - name: Logs dos containers (somente em caso de falha)
        if: failure()
        run: docker compose --env-file "$COMPOSE_ENV_FILE" logs --no-color

      - name: Encerrar e limpar os containers
        if: always()
        run: docker compose --env-file "$COMPOSE_ENV_FILE" down -v
